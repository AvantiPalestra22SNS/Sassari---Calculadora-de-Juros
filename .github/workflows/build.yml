name: Build exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name calculadora-juros calculadora.py
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-juros-exe
          path: dist/calculadora-juros.exe
