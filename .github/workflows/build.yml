name: Build exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller customtkinter
      - run: pyinstaller --onefile --windowed --collect-all customtkinter --name SassariCalculator SassariCalculator.py
      - uses: actions/upload-artifact@v4
        with:
          name: SassariCalculator-exe
          path: dist/SassariCalculator.exe
 
